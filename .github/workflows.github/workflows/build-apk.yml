name: Build KOTOBA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract KOTOBA ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ZIP project not found"
            exit 1
          fi

          echo "Found: $ZIP"

          mkdir -p project
          unzip -q "$ZIP" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find "${PROJECT_DIR}" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/KOTOBA.apk

          echo "APK created:"
          ls -lh output/KOTOBA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOTOBA-APK
          path: output/KOTOBA.apk
          retention-days: 30
